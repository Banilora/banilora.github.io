<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banilora - Tienda Online</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
        }

        /* Rejilla de productos */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .producto {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .producto img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
        }

        .producto h2 {
            margin: 15px 0 8px;
            font-size: 20px;
        }

        .producto p {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
            flex-grow: 1;
        }

        .precio-anterior {
            text-decoration: line-through;
            color: #888;
            font-size: 16px;
            margin-right: 8px;
        }

        .precio {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
            margin: 15px 0;
        }

        .boton {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .boton:hover {
            background: #1EBE57;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Banilora</h1>
    <p>Productos que te hacen la vida más fácil</p>
</header>

<!-- Catálogo de productos -->
<section class="catalogo">

    <!-- Producto 1: Lámpara LED -->
    <div class="producto">
        <img src="lampara.jpg" alt="Lámpara LED Táctil Recargable">
        <h2>Lámpara LED Táctil Recargable</h2>
        <p>Lámpara moderna de mesa con control táctil, 3 tonos de luz regulables y batería recargable por USB.</p>
        <div class="precio">
            <span class="precio-anterior">29,99 €</span>
            22,99 €
        </div>
        <a class="boton" href="https://wa.me/34622101177?text=Hola,%20quiero%20comprar%20la%20L%C3%A1mpara%20LED%20T%C3%A1ctil" target="_blank">
            Comprar por WhatsApp
        </a>
    </div>

</section>

<footer>
    © 2026 Banilora
</footer>

</body>
</html>
