<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banilora - Official Store</title>
    
    <!-- Enlace al CSS corregido con ./ para GitHub Pages -->
    <link rel="stylesheet" href="./style.css">
</head>
<body style="background-color: #111111; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px;">

    <!-- Tu header con el logo SVG personalizado -->
    <header>
        <div class="header-content">
            <div style="display: flex; align-items: center; gap: 14px;">
                <!-- Logo SVG -->
                <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fondo circular verde estilo marca -->
                    <circle cx="50" cy="50" r="48" fill="#111111" stroke="#25D366" stroke-width="3.5"/>
                    
                    <!-- Silueta de la cabeza y orejas erguidas -->
                    <path d="M 32,38 L 26,22 L 38,28 L 62,28 L 74,22 L 68,38 L 72,50 L 64,58 L 60,78 L 40,78 L 40,58 L 28,50 Z" fill="#25D366"/>
                    
                    <!-- Pecho blanco icónico -->
                    <path d="M 44,52 L 56,52 L 58,78 L 42,78 Z" fill="#FFFFFF"/>
                    <path d="M 40,40 L 50,30 L 60,40 L 58,48 L 42,48 Z" fill="#FFFFFF"/>
                    
                    <!-- Detalles cara y hocico -->
                    <ellipse cx="50" cy="42" rx="4" ry="3" fill="#111111"/>
                    <circle cx="42" cy="36" r="2.5" fill="#111111"/>
                    <circle cx="58" cy="36" r="2.5" fill="#111111"/>
                    
                    <!-- Arnés naranja -->
                    <path d="M 36,60 L 64,60 L 62,64 L 38,64 Z" fill="#FF9900"/>
                </svg>
                <div>
                    <h1 style="margin:0; font-size: 24px; color: #fff; font-weight: 800; letter-spacing: 1px; line-height: 1;">
                        BANILORA
                    </h1>
                    <span style="color: #25D366; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;">
                        Official Store
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal de la tienda -->
    <main style="margin-top: 30px;">
        <!-- Aquí van tus productos, textos o secciones -->
    </main>

    <!-- Enlace al JS corregido con ./ -->
    <script src="./script.js"></script>
</body>
</html>
