<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banilora</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
        }

        .producto {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .producto img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
        }

        .producto h2 {
            margin-bottom: 10px;
        }

        .precio {
            font-size: 26px;
            font-weight: bold;
            margin: 15px;
        }

        .boton {
            display: inline-block;
            background: #111;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .boton:hover {
            background: #333;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Banilora</h1>
    <p>Productos que te hacen la vida más fácil</p>
</header>

<div class="producto">

    <img src="https://via.placeholder.com/400x300?text=Auriculares+Bluetooth"
         alt="Auriculares Bluetooth">

    <h2>Auriculares Bluetooth Pro</h2>

    <p>
        Auriculares inalámbricos compactos, ideales para música,
        llamadas y uso diario.
    </p>

    <div class="precio">19,99 €</div>

    <a class="boton" href="#">
        Comprar ahora
    </a>

</div>

<footer>
    © 2026 Banilora
</footer>

</body>
</html>
